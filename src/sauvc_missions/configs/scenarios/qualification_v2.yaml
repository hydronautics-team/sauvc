initial: INIT
ok_state_package_name: stingray_missions
failed_state_package_name: stingray_missions
abort_state_package_name: stingray_missions
missions:
  INIT:
    config_name: init
    package_name: stingray_missions
  QUALIFICATION_V2:
    config_name: qualification_v2
    package_name: sauvc_missions
transitions:
  - { source: INIT, outcome: OK, dest: QUALIFICATION_V2 }
  - { source: QUALIFICATION_V2, outcome: OK, dest: OK }
  - { source: [INIT, QUALIFICATION_V2], outcome: FAILED, dest: FAILED }
